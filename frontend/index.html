<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>JobHunter</title>
  <style>
    :root {
      --bg: #f6f7f9;
      --surface: #ffffff;
      --text: #1b1f24;
      --muted: #5f6873;
      --line: #e3e6ea;
      --accent: #2952cc;
      --accent-soft: #eef2fd;
      --danger: #b42318;
      --danger-soft: #fdf1f0;
      --warn: #8a5300;
      --warn-soft: #fff6e5;
      --ok: #1f7a4a;
      --radius: 10px;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font);
                 font-size: 15px; line-height: 1.55; -webkit-font-smoothing: antialiased; }
    a { color: var(--accent); }
    button, input, select, textarea { font: inherit; color: inherit; }

    .topbar { background: var(--surface); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 10; }
    .topbar-inner { max-width: 1080px; margin: 0 auto; padding: 0 24px; display: flex; align-items: center;
                    gap: 32px; height: 60px; }
    .brand { font-weight: 650; font-size: 17px; letter-spacing: -0.01em; white-space: nowrap; }
    nav { display: flex; gap: 4px; overflow-x: auto; }
    nav a { text-decoration: none; color: var(--muted); padding: 8px 12px; border-radius: 8px; white-space: nowrap; }
    nav a:hover { color: var(--text); background: var(--bg); }
    nav a.active { color: var(--accent); background: var(--accent-soft); font-weight: 600; }

    main { max-width: 1080px; margin: 0 auto; padding: 40px 24px 80px; }
    h1 { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin: 0 0 6px; }
    h2 { font-size: 17px; font-weight: 650; margin: 0 0 12px; }
    h3 { font-size: 15px; font-weight: 650; margin: 0 0 8px; }
    .lead { color: var(--muted); margin: 0 0 28px; max-width: 680px; }
    .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
    .stack > * + * { margin-top: 20px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }

    label { display: block; font-weight: 600; font-size: 14px; margin-bottom: 6px; }
    .hint { color: var(--muted); font-size: 13px; font-weight: 400; }
    input[type=text], input[type=url], input[type=number], select, textarea {
      width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: #fff; }
    textarea { min-height: 240px; resize: vertical; }
    input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
    .field + .field { margin-top: 16px; }
    .row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
    .form-row { display: grid; grid-template-columns: 2fr 1.4fr 1fr auto; gap: 12px; align-items: end; }
    .form-row.two { grid-template-columns: minmax(0, 420px) auto; justify-content: start; }
    .check { display: flex; gap: 8px; align-items: center; font-weight: 400; color: var(--muted); margin-top: 14px; }

    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 8px;
           padding: 10px 16px; border: 1px solid var(--line); background: #fff; cursor: pointer;
           text-decoration: none; color: var(--text); font-weight: 550; white-space: nowrap; }
    .btn:hover { border-color: #c9ced5; }
    .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .btn.primary:hover { background: #2347b3; }
    .btn:disabled { opacity: 0.55; cursor: not-allowed; }
    .link { color: var(--accent); text-decoration: none; font-weight: 550; }
    .link:hover { text-decoration: underline; }

    .alert { border-radius: 8px; padding: 12px 14px; border: 1px solid; }
    .alert.error { background: var(--danger-soft); border-color: #f4c7c3; color: var(--danger); }
    .alert.warn { background: var(--warn-soft); border-color: #f2d9a8; color: var(--warn); }
    .choix-cv { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-top: 12px; justify-items: start; }
    .choix-cv .btn { text-align: left; white-space: normal; overflow-wrap: anywhere; max-width: 100%; }
    .alert.info { background: var(--accent-soft); border-color: #d3dcf8; color: #1d3c99; }
    .alert ul { margin: 6px 0 0; padding-left: 18px; }
    .empty { text-align: center; color: var(--muted); padding: 48px 24px; }
    .loading { display: flex; gap: 12px; align-items: center; color: var(--muted); padding: 20px 0; }
    .card.loading { padding: 20px 24px; }
    .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--accent);
               border-radius: 50%; animation: spin 0.8s linear infinite; flex: none; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .meta { color: var(--muted); font-size: 14px; }
    .score { font-weight: 650; color: var(--accent); font-size: 14px; white-space: nowrap; }
    .offer { padding: 20px 24px; }
    .offer + .offer { margin-top: 12px; }
    .offer-head { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
    .offer p.excerpt { color: var(--muted); margin: 10px 0 16px; display: -webkit-box; -webkit-line-clamp: 3;
                       -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; }
    ul.plain { list-style: none; padding: 0; margin: 0; }
    ul.plain li { padding: 6px 0; border-bottom: 1px solid var(--line); }
    ul.plain li:last-child { border-bottom: 0; }
    .sub { color: var(--muted); font-size: 13px; }
    .letter { white-space: pre-wrap; font-family: var(--font); font-size: 14px; line-height: 1.6; max-height: 640px;
              overflow: auto; background: var(--bg); border-radius: 8px; padding: 18px; margin: 0; }
    img.preview { display: block; width: 100%; height: auto; border: 1px solid var(--line); border-radius: 8px; background: #fff; }
    .message-repli { margin-top: 12px; }
    .message-repli summary { cursor: pointer; color: var(--accent); font-weight: 550; font-size: 14px; width: fit-content; }
    .letter.message { max-height: 340px; margin-top: 10px; }
    .journal { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 12.5px; line-height: 1.6;
               white-space: pre-wrap; overflow-wrap: anywhere; background: var(--bg); border-radius: 8px; padding: 14px;
               margin: 0; max-height: 300px; overflow: auto; }
    .captures { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 14px; }
    .capture { display: block; text-decoration: none; color: var(--muted); font-size: 13px; }
    .capture img { display: block; width: 100%; height: 120px; object-fit: cover; object-position: top;
                   border: 1px solid var(--line); border-radius: 8px; background: #fff; margin-bottom: 6px; }
    .success { color: var(--ok); font-weight: 600; }
    .etat { font-weight: 650; font-size: 14px; border-radius: 999px; padding: 4px 12px; white-space: nowrap;
            background: var(--bg); color: var(--muted); }
    .etat.ok { background: #e8f5ee; color: var(--ok); } .etat.attente { background: var(--accent-soft); color: #1d3c99; }
    .etat.pause { background: var(--warn-soft); color: var(--warn); } .etat.alerte { background: var(--danger-soft); color: var(--danger); }
    .stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 14px; }
    .stat { padding: 16px 18px; } .stat .chiffre { font-size: 28px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.3; }
    .etapes { display: flex; flex-wrap: wrap; gap: 8px; padding: 0; margin: 0 0 18px; list-style: none; counter-reset: etape; }
    .etapes li { counter-increment: etape; font-size: 13px; color: var(--muted); border: 1px solid var(--line);
                 border-radius: 999px; padding: 4px 12px; }
    .etapes li::before { content: counter(etape) ". "; font-weight: 650; }
    .etapes li.faite { color: var(--ok); border-color: #bfe3cf; background: #f1f9f4; }
    .etapes li.courante { color: var(--accent); border-color: var(--accent); background: var(--accent-soft); font-weight: 600; }
    .passage + .passage { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--line); }
    ul.choix { margin-top: 10px; max-height: 300px; overflow: auto; }
    ul.choix .check span { color: var(--text); }
    ul.metiers li { padding: 3px 0; font-size: 13.5px; }
    .lancement { align-items: end; }
    .lancement .nombre { margin: 0; font-weight: 600; font-size: 14px; }
    .lancement .nombre input { display: block; width: 140px; margin-top: 6px; }
    .filtres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) minmax(0, 1.6fr); gap: 12px; margin-top: 14px; }
    .pagination { justify-content: space-between; margin-top: 14px; }
    .statut { font-weight: 600; } .statut.envoyee { color: var(--ok); } .statut.incertaine, .statut.brouillon { color: var(--warn); }
    .statut.erreur { color: var(--danger); } .statut.ignoree { color: var(--muted); }
    table.plan th, table.plan td { text-align: right; padding: 8px 6px; } table.plan th:first-child, table.plan td:first-child { text-align: left; }

    table { width: 100%; border-collapse: collapse; }
    th { text-align: left; font-size: 13px; color: var(--muted); font-weight: 600; padding: 10px 12px;
         border-bottom: 1px solid var(--line); }
    td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    tr:last-child td { border-bottom: 0; }
    td select { min-width: 190px; }
    .relance { color: var(--warn); font-weight: 600; }
    .tag { font-size: 12px; color: var(--muted); }

    .status-list .item { display: flex; justify-content: space-between; gap: 16px; padding: 14px 0;
                         border-bottom: 1px solid var(--line); }
    .status-list .item:last-child { border-bottom: 0; }
    .state-ok { color: var(--ok); font-weight: 600; white-space: nowrap; }
    .state-off { color: var(--danger); font-weight: 600; white-space: nowrap; }
    code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 13px; background: var(--bg);
           padding: 2px 6px; border-radius: 6px; overflow-wrap: anywhere; }
    .fallback { max-width: 640px; margin: 80px auto; padding: 0 24px; color: var(--muted); }

    @media (max-width: 760px) {
      .topbar { position: static; } /* menu sur deux lignes : ne pas masquer le contenu en défilant */
      .topbar-inner { flex-direction: column; align-items: stretch; height: auto; gap: 6px; padding: 12px 16px 8px; }
      main { padding: 24px 16px 64px; }
      h1 { font-size: 22px; }
      .card { padding: 18px; }
      .grid-3, .grid-2, .form-row, .form-row.two { grid-template-columns: 1fr; }
      .captures { grid-template-columns: repeat(2, 1fr); }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .stats .stat:last-child { grid-column: 1 / -1; }
      .filtres { grid-template-columns: 1fr 1fr; }
      .filtres > div:last-child { grid-column: 1 / -1; }
      .pagination .sub { order: -1; width: 100%; }
      table.plan tr { display: flex; flex-wrap: wrap; gap: 2px 14px; }
      table.plan td { width: auto; text-align: left; }
      table.plan td[data-label]::before { display: inline; margin-right: 4px; }
      table.plan td:first-child, table.plan td:last-child { width: 100%; }
      nav { flex-wrap: wrap; overflow-x: visible; }
      nav a { padding: 6px 10px; }
      .offer-head { flex-direction: column; gap: 4px; }
      table, thead, tbody, tr, td { display: block; width: 100%; }
      thead { display: none; }
      tr { border-bottom: 1px solid var(--line); padding: 10px 0; }
      tr:last-child { border-bottom: 0; }
      td { border: 0; padding: 4px 0; }
      td[data-label]::before { content: attr(data-label); display: block; font-size: 12px; color: var(--muted); }
      td select { min-width: 0; }
      table.compact td { padding: 1px 0; }
      table.compact td[data-label]::before { display: inline; margin-right: 6px; }
      table.compact td .sub { display: inline; margin-left: 4px; }
      .row .btn { padding: 9px 12px; }
    }
  </style>
</head>
<body>
<div id="app">
  <!-- Visible seulement si l'application ne démarre pas : jamais d'écran blanc. -->
  <div class="fallback">
    <h1>JobHunter</h1>
    <p>Chargement de l'interface… Si ce message reste affiché, le fichier frontend/vendor/vue-3.4.38.global.prod.js
       est introuvable : vérifiez qu'il est présent puis rechargez la page.</p>
  </div>
</div>

<template id="tpl">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">JobHunter</div>
      <nav aria-label="Navigation principale">
        <a v-for="v in views" :key="v.id" :href="'#/' + v.id" :class="{ active: view === v.id }">{{ v.label }}</a>
      </nav>
    </div>
  </header>

  <main>
    <!-- 1. Nouvelle candidature -->
    <section v-if="view === 'candidature'" class="stack">
      <div>
        <h1>Nouvelle candidature</h1>
        <p class="lead">Collez le texte de l'offre : le CV et la lettre sont adaptés à partir de votre CV maître.
          Rien n'est envoyé automatiquement.</p>
      </div>

      <div class="card">
        <div v-if="prep.source" class="alert info" style="margin-bottom:16px">Offre France Travail : {{ prep.label }}</div>
        <div class="field">
          <label for="offer">Texte de l'offre</label>
          <textarea id="offer" v-model="prep.text" placeholder="Intitulé, entreprise, missions, profil recherché…"></textarea>
        </div>
        <div class="field">
          <label for="url">Lien de l'offre <span class="hint">facultatif</span></label>
          <input id="url" type="url" v-model="prep.url" placeholder="https://…">
        </div>
        <div class="row" style="margin-top:20px">
          <button class="btn primary" :disabled="prep.loading" @click="prepare">Préparer</button>
          <button v-if="prep.text || prep.result" class="btn" :disabled="prep.loading" @click="resetPrep">Effacer</button>
        </div>
        <div v-if="prep.error" class="alert error" style="margin-top:16px" role="alert">{{ prep.error }}</div>
        <div v-if="prep.loading" class="loading" role="status">
          <span class="spinner"></span>
          <span>Analyse de l'offre, adaptation du CV et rédaction de la lettre. Cela peut prendre jusqu'à une minute.</span>
        </div>
      </div>

      <div v-if="!prep.result && !prep.loading" class="card empty">
        Le rapport, le CV et la lettre apparaîtront ici après la préparation.
      </div>

      <template v-if="prep.result">
        <div class="card">
          <div class="offer-head">
            <div>
              <h2 style="margin:0">{{ prep.result.offre.titre || 'Offre' }}</h2>
              <div class="meta">{{ [prep.result.offre.entreprise, contractLabel(prep.result.offre.contrat)].filter(Boolean).join(' · ') }}</div>
            </div>
            <div class="meta">Statut : {{ prep.result.statut || '—' }}</div>
          </div>
          <div class="row" style="margin-top:18px">
            <a class="btn primary" :href="prep.result.cv.telechargement">Télécharger le CV</a>
            <a v-if="prep.result.lettre" class="btn" :href="prep.result.lettre.telechargement">Télécharger la lettre</a>
            <button v-if="prep.result.lettre" class="btn" @click="copyLetter">{{ prep.copied ? 'Lettre copiée' : 'Copier la lettre' }}</button>
            <a v-if="prep.result.offre.url" class="btn" :href="prep.result.offre.url" target="_blank" rel="noopener noreferrer">Ouvrir l'offre</a>
            <button class="btn" :disabled="prep.marking || !!prep.applied" @click="markApplied">
              {{ prep.marking ? 'Enregistrement…' : 'Marquer comme postulé' }}</button>
          </div>
          <p v-if="prep.applied" class="success" style="margin:14px 0 0">
            Postulé le {{ fmtDate(prep.applied.date_envoi) }} · relance prévue le {{ fmtDate(prep.applied.relance_le) }}</p>
          <div v-if="prep.markError" class="alert error" style="margin-top:14px">{{ prep.markError }}</div>
          <div v-if="prep.copyError" class="alert error" style="margin-top:14px">{{ prep.copyError }}</div>
        </div>

        <div class="grid-3">
          <div class="card">
            <h3>Points forts</h3>
            <ul v-if="prep.result.rapport.points_forts.length" class="plain">
              <li v-for="p in prep.result.rapport.points_forts" :key="p.mot_cle">
                {{ p.mot_cle }}
                <div v-if="viaLabel(p)" class="sub">{{ viaLabel(p) }}</div>
              </li>
            </ul>
            <p v-else class="sub">Aucun mot-clé de l'offre retrouvé dans le CV.</p>
          </div>
          <div class="card">
            <h3>Manques</h3>
            <ul v-if="prep.result.rapport.manques.length" class="plain">
              <li v-for="m in prep.result.rapport.manques" :key="m">{{ m }}</li>
            </ul>
            <p v-else class="sub">Aucun mot-clé manquant.</p>
          </div>
          <div class="card">
            <h3>Informations</h3>
            <ul v-if="prep.result.rapport.informations.length" class="plain">
              <li v-for="i in prep.result.rapport.informations" :key="i">{{ i }}</li>
            </ul>
            <p v-else class="sub">Rien à signaler.</p>
          </div>
        </div>

        <div class="grid-2">
          <div class="card">
            <h3>CV</h3>
            <img class="preview" :src="prep.result.cv.apercu" alt="Aperçu de la première page du CV">
            <p class="sub" style="margin:10px 0 0">Aperçu de la page ; le CV complet se télécharge en PDF.</p>
          </div>
          <div class="card">
            <div class="offer-head">
              <h3 style="margin:0">Lettre de motivation</h3>
              <button class="btn" :disabled="prep.regenerating" @click="regenerateLetter">
                {{ prep.regenerating ? 'Rédaction…' : 'Régénérer la lettre' }}</button>
            </div>
            <p class="sub" style="margin:6px 0 12px">
              <template v-if="prep.regenerating"></template>
              <template v-else-if="prep.result.lettre && prep.result.lettre.depuis_cache">Lettre déjà rédigée pour cette offre, reprise sans nouvel appel au modèle.</template>
              <template v-else>« Régénérer » fait rédiger une nouvelle lettre (nouvel appel au modèle).</template></p>
            <div v-if="prep.regenerating" class="loading" role="status"><span class="spinner"></span>Rédaction d'une nouvelle lettre…</div>
            <div v-if="prep.regenError" class="alert error" style="margin-bottom:12px" role="alert">{{ prep.regenError }}</div>
            <div v-if="prep.result.lettre_erreur" class="alert error">
              Lettre non générée : {{ prep.result.lettre_erreur }} Le CV reste disponible.</div>
            <template v-else-if="prep.result.lettre">
              <div v-if="prep.result.lettre.statut === 'brouillon'" class="alert warn" style="margin-bottom:12px">
                Brouillon à corriger avant tout envoi :
                <ul><li v-for="p in prep.result.lettre.a_corriger" :key="p">{{ p }}</li></ul>
              </div>
              <pre class="letter">{{ prep.result.lettre.texte }}</pre>
            </template>
          </div>
        </div>
      </template>
    </section>

    <!-- 2. Offres France Travail -->
    <section v-if="view === 'offres'" class="stack">
      <div>
        <h1>Offres France Travail</h1>
        <p class="lead">Offres classées par correspondance avec votre CV maître. « Préparer ma candidature » ouvre
          l'offre dans l'écran de candidature ; « Voir l'offre » s'ouvre dans un nouvel onglet.</p>
      </div>
      <form class="card" @submit.prevent="search">
        <div class="form-row">
          <div>
            <label for="kw">Poste</label>
            <input id="kw" type="text" v-model="offers.keyword" list="titles">
            <datalist id="titles"><option v-for="t in defaults.titres" :key="t" :value="t"></option></datalist>
          </div>
          <div>
            <label for="city">Ville <span class="hint">facultatif</span></label>
            <input id="city" type="text" v-model="offers.city" placeholder="France entière">
          </div>
          <div>
            <label for="contract">Contrat</label>
            <select id="contract" v-model="offers.contract">
              <option value="">Tous</option><option value="CDI">CDI</option><option value="CDD">CDD</option>
            </select>
          </div>
          <button class="btn primary" type="submit" :disabled="offers.loading">Rechercher</button>
        </div>
        <label v-if="defaults.mots_exclus.length" class="check">
          <input type="checkbox" v-model="offers.hide"> Masquer les postes {{ defaults.mots_exclus.join(', ') }}
        </label>
      </form>

      <div v-if="offers.error" class="alert error" role="alert">{{ offers.error }}</div>
      <div v-if="offers.loading" class="card loading" role="status"><span class="spinner"></span>Recherche des offres…</div>
      <div v-else-if="!offers.searched && !offers.error" class="card empty">Lancez une recherche pour afficher les offres.</div>
      <div v-else-if="offers.searched && !offers.items.length && !offers.error" class="card empty">
        Aucune offre ne correspond à cette recherche{{ offers.hidden ? ' (' + offers.hidden + ' masquée(s) par le filtre)' : '' }}.</div>
      <template v-else-if="offers.items.length">
        <p class="meta" style="margin:0">{{ offers.items.length }} offre(s){{ offers.hidden ? ' · ' + offers.hidden + ' masquée(s) par le filtre' : '' }}</p>
        <div>
          <article v-for="o in offers.items" :key="o.source + o.external_id" class="card offer">
            <div class="offer-head">
              <h2 style="margin:0">{{ o.title }}</h2>
              <span v-if="o.match_score !== null && o.match_score !== undefined" class="score">{{ Math.round(o.match_score) }} % de correspondance</span>
            </div>
            <div class="meta">{{ [o.company, o.location, o.contract_type, fmtDate(o.publication_date)].filter(Boolean).join(' · ') }}</div>
            <p class="excerpt">{{ o.description }}</p>
            <div class="row">
              <button class="btn primary" @click="prepareFromOffer(o)">Préparer ma candidature</button>
              <a v-if="o.url" class="link" :href="o.url" target="_blank" rel="noopener noreferrer">Voir l'offre</a>
            </div>
          </article>
        </div>
      </template>
    </section>

    <!-- 3. Campagne La Bonne Boîte -->
    <section v-if="view === 'campagne'" class="stack">
      <div>
        <h1>Campagne</h1>
        <p class="lead">Candidatures spontanées en nombre sur La Bonne Boîte : votre CV déjà téléversé et un message
          général, jamais rédigé par le modèle de langage. Choisissez combien en envoyer : le robot les enchaîne dans sa
          fenêtre, sans pause, puis s'arrête.</p>
      </div>
      <div v-if="camp.error" class="alert error" role="alert">{{ camp.error }}</div>
      <div v-if="camp.loading && !camp.data" class="card loading" role="status"><span class="spinner"></span>Chargement…</div>
      <template v-else-if="camp.data">
        <!-- État et commandes -->
        <div class="card">
          <div class="offer-head">
            <h2 style="margin:0">État de la campagne</h2>
            <span :class="['etat', etatCampagne.classe]">{{ etatCampagne.libelle }}</span>
          </div>
          <div v-if="camp.data.alerte" class="alert error" style="margin-top:14px" role="alert">
            <strong>Arrêtée sur alerte : {{ camp.data.alerte.libelle }}.</strong> {{ camp.data.alerte.raison }}
            <div style="margin-top:6px">Pas de reprise aujourd'hui : la campagne pourra redémarrer demain.</div></div>
          <div v-if="camp.data.plan.inventaire.etat === 'erreur'" class="alert error" style="margin-top:14px" role="alert">
            <strong>Inventaire interrompu.</strong> {{ camp.data.plan.inventaire.erreur }}</div>
          <div v-if="camp.acces && !camp.acces.ok && camp.data.etape > 1" class="alert warn" style="margin-top:14px">
            API La Bonne Boîte : {{ camp.acces.detail }}</div>
          <div v-if="robot.data && robot.data.actif && robot.data.attente === 'connexion'" class="alert info" style="margin-top:14px">
            Connectez-vous vous-même avec France Travail dans la fenêtre du robot : il attend votre connexion.</div>
          <div v-if="robot.data && robot.data.actif && robot.data.attente === 'reconnexion'" class="alert warn" style="margin-top:14px">
            Session perdue : reconnectez-vous dans la fenêtre du robot (20 min au plus), la campagne reprendra ensuite.</div>
          <div v-if="robot.data && robot.data.actif && robot.data.attente === 'clic'" class="alert info" style="margin-top:14px">
            Calibrage : cliquez vous-même sur le bouton d'envoi du site pour <strong>{{ robot.data.entreprise }}</strong>
            dans la fenêtre du robot, ou passez (le brouillon reste sur La Bonne Boîte).
            <div class="row" style="margin-top:10px"><button class="btn" :disabled="robot.busy" @click="passerCalibrage">Passer</button></div></div>
          <div v-if="robot.data && robot.data.actif && robot.data.statut === 'en_cours' && !robot.data.attente" class="loading" role="status">
            <span class="spinner"></span>{{ robot.data.etape }}</div>
          <div class="row lancement" style="margin-top:16px">
            <label for="c-nombre" class="nombre">Candidatures à envoyer
              <input id="c-nombre" type="number" min="1" :max="camp.data.objectif_max" v-model.number="camp.nombre"
                     @input="camp.nombreTouche = true"></label>
            <button class="btn primary" :disabled="robotBusy || camp.data.etape < 5 || !!camp.data.alerte || !nombreValide"
                    @click="startRobot('campagne', null, camp.nombre)">Démarrer</button>
            <button v-if="robot.data && robot.data.actif && !robot.data.pause_demandee" class="btn" :disabled="robot.busy"
                    @click="pauseRobot(true)">Pause</button>
            <button v-if="robot.data && robot.data.actif && robot.data.pause_demandee" class="btn" :disabled="robot.busy"
                    @click="pauseRobot(false)">Reprendre</button>
            <button v-if="robot.data && robot.data.actif" class="btn" :disabled="robot.stopping" @click="stopRobot">
              {{ robot.data.fenetre_ouverte ? 'Fermer la fenêtre du robot' : 'Arrêter' }}</button>
          </div>
          <p class="sub" style="margin:12px 0 0">Le robot s'arrête une fois ce nombre envoyé (confirmé). Une entreprise en
            échec est mise de côté (reprise plus tard) et il continue ; si le site est en difficulté, il fait une pause.
            Arrêt plus tôt seulement si le site s'y oppose (limite, code 403, captcha non résolu). Envoyées aujourd'hui :
            {{ camp.data.envois_du_jour }}.</p>
          <p v-if="camp.nombre !== '' && !nombreValide" class="sub" style="margin:6px 0 0;color:var(--danger)">
            Indiquez un nombre entier entre 1 et {{ camp.data.objectif_max }}.</p>
          <p v-if="camp.data.etape < 5" class="sub" style="margin:6px 0 0">Démarrer : terminez d'abord le premier passage
            (étape {{ camp.data.etape }} sur 5).</p>
          <div v-if="robot.error" class="alert error" style="margin-top:14px" role="alert">{{ robot.error }}</div>
        </div>

        <!-- Compteurs -->
        <div class="stats">
          <div class="card stat"><div class="sub">Envoyées</div><div class="chiffre">{{ camp.data.compteurs.jour.envoyees }}</div>
            <div class="sub">aujourd'hui · {{ camp.data.compteurs.total.envoyees }} au total</div></div>
          <div class="card stat"><div class="sub">Incertaines</div><div class="chiffre">{{ camp.data.compteurs.jour.incertaines }}</div>
            <div class="sub">aujourd'hui · {{ camp.data.compteurs.total.incertaines }} au total</div></div>
          <div class="card stat"><div class="sub">Ignorées</div>
            <div class="chiffre">{{ camp.data.compteurs.jour.ignorees.sans_email + camp.data.compteurs.jour.ignorees.deja_candidate
              + camp.data.compteurs.jour.ignorees.formulaire_inactif + camp.data.compteurs.jour.ignorees.introuvable }}</div>
            <div class="sub">aujourd'hui · total : sans e-mail {{ camp.data.compteurs.total.ignorees.sans_email }}, déjà
              candidaté {{ camp.data.compteurs.total.ignorees.deja_candidate }}, formulaire inactif
              {{ camp.data.compteurs.total.ignorees.formulaire_inactif }}, introuvable sur le site
              {{ camp.data.compteurs.total.ignorees.introuvable }}</div></div>
          <div class="card stat"><div class="sub">Erreurs</div><div class="chiffre">{{ camp.data.compteurs.jour.erreurs }}</div>
            <div class="sub">aujourd'hui · {{ camp.data.compteurs.total.erreurs }} au total</div></div>
          <div class="card stat"><div class="sub">Restantes</div><div class="chiffre">{{ camp.data.compteurs.restantes.A
              + (camp.data.reglages.phase_b ? camp.data.compteurs.restantes.B : 0) }}</div>
            <div class="sub">phase A : {{ camp.data.compteurs.restantes.A }} · phase B : {{ camp.data.compteurs.restantes.B }}<template
              v-if="!camp.data.reglages.phase_b"> (désactivée)</template></div></div>
        </div>

        <!-- Plan et inventaire : toujours visibles -->
        <div class="card">
          <h2>Plan</h2>
          <div class="row">
            <button class="btn" :disabled="camp.accesLoading" @click="checkAccesCampagne">
              {{ camp.accesLoading ? 'Vérification…' : "Vérifier l'accès à l'API" }}</button>
            <button class="btn" :disabled="camp.invLoading || inventaireEnCours" @click="lancerInventaire()">
              {{ inventaireEnCours ? 'Inventaire en cours…' : "Lancer l'inventaire des entreprises" }}</button>
            <button v-if="inventaireAJour" class="btn" :disabled="camp.invLoading" @click="nouvelInventaire">
              Nouvel inventaire</button>
          </div>
          <div v-if="camp.acces" :class="['alert', camp.acces.ok ? 'info' : 'error']" style="margin-top:12px">{{ camp.acces.detail }}
              <div v-if="!camp.acces.ok" style="margin-top:6px">Autre possibilité : lire les pages de recherche du site
                La Bonne Boîte. Elle n'est pas lancée sans votre accord.</div></div>
            <div v-if="camp.invError" class="alert error" style="margin-top:12px" role="alert">{{ camp.invError }}</div>
          <p class="sub" style="margin:10px 0 14px">Inventaire : {{ inventaireTexte }}</p>
          <details v-if="camp.data.plan.inventaire.refus && camp.data.plan.inventaire.refus.length" class="message-repli"
                   style="margin:0 0 14px">
            <summary>Recherches refusées par La Bonne Boîte et sautées ({{ camp.data.plan.inventaire.refus.length }})</summary>
            <ul class="plain metiers"><li v-for="r in camp.data.plan.inventaire.refus" :key="r">{{ r }}</li></ul>
          </details>
            <table class="compact plan">
              <thead><tr><th>Phase</th><th>Métiers</th><th v-for="d in camp.data.plan.phases.A.idf" :key="d.departement">{{ d.departement }}</th>
                <th>Reste de la France</th><th>Éligibles</th></tr></thead>
              <tbody>
                <tr v-for="p in ['A', 'B']" :key="p">
                  <td data-label="Phase">{{ p }}<span v-if="p === 'B' && !camp.data.reglages.phase_b" class="sub"> (désactivée)</span></td>
                  <td data-label="Métiers">{{ camp.data.plan.phases[p].metiers }}</td>
                  <td v-for="d in camp.data.plan.phases[p].idf" :key="d.departement" :data-label="d.departement">{{ d.nombre }}</td>
                  <td data-label="Reste de la France">{{ camp.data.plan.phases[p].reste }}</td>
                  <td data-label="Éligibles"><strong>{{ camp.data.plan.phases[p].eligibles }}</strong></td>
                </tr>
              </tbody>
            </table>
            <p class="sub" style="margin:8px 0 0">Ordre : Île-de-France (75, 92, 93, 94, 91, 78, 95, 77), puis le reste de la
              France ; potentiel d'embauche décroissant ; dédoublonnage par SIRET. Déjà dans votre base et exclues :
              {{ camp.data.plan.deja_en_base }}.</p>
            <details class="message-repli">
              <summary>Métiers de la phase A ({{ camp.data.plan.phases.A.metiers }}) et de la phase B ({{ camp.data.plan.phases.B.metiers }})</summary>
              <div class="grid-2" style="margin-top:10px">
                <div v-for="p in ['A', 'B']" :key="p">
                  <h3>Phase {{ p }}{{ p === 'B' ? ' (à valider, désactivée par défaut)' : '' }}</h3>
                  <div v-for="g in camp.data.metiers[p]" :key="g.groupe" style="margin-bottom:10px">
                    <div class="sub"><strong>{{ g.groupe }}</strong></div>
                    <ul class="plain metiers"><li v-for="m in g.metiers" :key="m.rome"><code>{{ m.rome }}</code> {{ m.libelle }}
                      <span v-if="camp.verif && camp.verif.metiers[m.rome]" :class="camp.verif.metiers[m.rome].ok ? 'state-ok' : 'state-off'">
                        {{ camp.verif.metiers[m.rome].ok ? '✓' : '≠ ' + (camp.verif.metiers[m.rome].officiel || 'introuvable') }}</span></li></ul>
                  </div>
                </div>
              </div>
            </details>
        </div>

        <!-- Premier passage -->
        <div v-if="camp.data.etape < 5" class="card">
          <h2>Premier passage</h2>
          <ol class="etapes">
            <li v-for="(t, i) in etapesPassage" :key="i" :class="{ faite: i + 1 < camp.data.etape, courante: i + 1 === camp.data.etape }">{{ t }}</li>
          </ol>

          <!-- 1. Liste des métiers -->
          <div v-if="camp.data.etape === 1" class="passage">
            <h3>1. Accès à l'API, plan et liste des métiers</h3>
            <p class="sub" style="margin:0">Vérifiez l'accès et lancez l'inventaire (« Plan », ci-dessus), relisez les métiers, puis validez.</p>
            <div v-if="camp.data.etape === 1" class="row" style="margin-top:12px">
              <button class="btn" :disabled="camp.verifLoading" @click="verifierMetiers">
                {{ camp.verifLoading ? 'Vérification…' : 'Vérifier les codes dans le référentiel' }}</button>
              <button class="btn primary" :disabled="camp.busy" @click="validerMetiers">Valider la liste des métiers</button>
            </div>
            <div v-if="camp.verif" :class="['alert', camp.verif.ok ? 'info' : 'warn']" style="margin-top:12px">
              {{ camp.verif.ok ? 'Tous les codes existent dans le référentiel officiel des métiers.'
                : 'Certains codes ne correspondent pas au référentiel : voir la liste.' }}</div>
          </div>

          <!-- 2 et 3. Essai et calibrage : choix de l'entreprise -->
          <div v-if="camp.data.etape === 2 || camp.data.etape === 3" class="passage">
            <h3 v-if="camp.data.etape === 2">2. Essai sans envoi sur une entreprise de votre choix</h3>
            <h3 v-else>3. Calibrage : vous envoyez vous-même une candidature, le robot observe</h3>
            <p class="sub" style="margin:0 0 10px">{{ camp.data.etape === 2
              ? "Le robot va jusqu'à la Synthèse, capture la page entière et liste les boutons ; il n'envoie rien (un brouillon reste sur La Bonne Boîte)."
              : "Choisissez une entreprise qui vous intéresse peu : une candidature ne se refait pas. Le robot va jusqu'à la Synthèse, puis vous cliquez vous-même sur le bouton d'envoi du site." }}</p>
            <div class="form-row two">
              <div><label for="camp-recherche">Entreprise</label>
                <input id="camp-recherche" type="text" v-model="camp.recherche" placeholder="Nom, ville ou SIRET" @input="chercherEntreprises"></div>
            </div>
            <ul class="plain choix">
              <li v-for="e in camp.choix" :key="e.siret">
                <label class="check" style="margin:0"><input type="radio" name="camp-choix" :value="e.siret" v-model="camp.choixSiret">
                  <span><strong>{{ e.entreprise }}</strong> · {{ e.ville || 'ville inconnue' }} · {{ e.metier }}
                    <span v-if="e.statut === 'brouillon'" class="tag">brouillon non envoyé</span></span></label></li>
              <li v-if="!camp.choix.length" class="sub">Aucune entreprise : lancez l'inventaire, ou ajoutez-en une ci-dessous.</li>
            </ul>
            <details class="message-repli">
              <summary>Ajouter une entreprise à la main (SIRET)</summary>
              <form class="grid-3" style="margin-top:10px" novalidate @submit.prevent="ajouterManuelle">
                <div><label for="m-siret">SIRET</label><input id="m-siret" type="text" inputmode="numeric" v-model="camp.manuel.siret"></div>
                <div><label for="m-nom">Nom sur La Bonne Boîte</label><input id="m-nom" type="text" v-model="camp.manuel.entreprise"></div>
                <div><label for="m-rome">Métier</label><select id="m-rome" v-model="camp.manuel.rome">
                  <option v-for="m in tousMetiers" :key="m.rome" :value="m.rome">{{ m.rome }} · {{ m.libelle }}</option></select></div>
                <div><label for="m-dep">Département</label><select id="m-dep" v-model="camp.manuel.departement">
                  <option value="">Choisir…</option>
                  <option v-for="d in camp.data.plan.departements" :key="d" :value="d">{{ d }}</option></select></div>
                <div><button class="btn" type="submit" :disabled="camp.busy">Ajouter</button></div>
              </form>
              <div v-if="camp.manuelError" class="alert error" style="margin-top:10px" role="alert">{{ camp.manuelError }}</div>
            </details>
            <div class="row" style="margin-top:14px">
              <button v-if="camp.data.etape === 2" class="btn primary" :disabled="robotBusy || !camp.choixSiret"
                      @click="startRobot('essai', camp.choixSiret)">Lancer l'essai (sans envoi)</button>
              <button v-else class="btn primary" :disabled="robotBusy || !camp.choixSiret"
                      @click="startRobot('calibrage', camp.choixSiret)">Lancer le calibrage</button>
              <button v-if="camp.data.etape === 3" class="btn" :disabled="robotBusy || !camp.choixSiret"
                      @click="startRobot('essai', camp.choixSiret)">Refaire un essai</button>
            </div>
            <div v-if="camp.data.passage.essai" class="alert info" style="margin-top:14px">
              Essai du {{ fmtDate(camp.data.passage.essai.le) }} sur <strong>{{ camp.data.passage.essai.entreprise }}</strong> :
              Synthèse atteinte, rien envoyé.
              <div v-if="camp.data.passage.essai.ecarts && camp.data.passage.essai.ecarts.length" style="margin-top:6px"><strong>Écart :</strong>
                {{ camp.data.passage.essai.ecarts.join(', ') }}.</div>
              <div style="margin-top:6px">Boutons trouvés : {{ (camp.data.passage.essai.boutons || []).join(' · ') }}</div>
              <a v-if="camp.data.passage.essai.capture" class="link" target="_blank" rel="noopener noreferrer"
                 :href="'/api/campagne/robot/captures/' + camp.data.passage.essai.run + '/' + camp.data.passage.essai.capture">Voir la capture de la Synthèse</a>
            </div>
            <!-- Règle proposée par le calibrage -->
            <form v-if="camp.data.etape === 3 && camp.data.passage.regle" class="regle" novalidate @submit.prevent="validerRegle"
                  @input="camp.regleTouched = true">
              <h3 style="margin-top:16px">Règle de reconnaissance proposée</h3>
              <p class="sub" style="margin:0 0 10px">Observée après votre clic sur <strong>{{ camp.data.passage.calibrage && camp.data.passage.calibrage.entreprise }}</strong>
                (<a v-if="camp.data.passage.calibrage && camp.data.passage.calibrage.capture" class="link" target="_blank" rel="noopener noreferrer"
                :href="'/api/campagne/robot/captures/' + camp.data.passage.calibrage.run + '/' + camp.data.passage.calibrage.capture">capture</a>).
                Un envoi n'est compté que si l'adresse et le texte correspondent.</p>
              <div class="grid-3">
                <div><label for="r-bouton">Bouton d'envoi</label><input id="r-bouton" type="text" v-model="camp.regle.bouton"></div>
                <div><label for="r-url">Adresse de confirmation</label><input id="r-url" type="text" v-model="camp.regle.url_motif"></div>
                <div><label for="r-texte">Texte de confirmation</label><input id="r-texte" type="text" v-model="camp.regle.texte"></div>
              </div>
              <div class="row" style="margin-top:12px"><button class="btn primary" type="submit" :disabled="camp.busy">Valider la règle</button></div>
              <div v-if="camp.regleError" class="alert error" style="margin-top:10px" role="alert">{{ camp.regleError }}</div>
            </form>
          </div>

          <!-- 4. Cinq envois devant vous -->
          <div v-if="camp.data.etape === 4" class="passage">
            <h3>4. Cinq envois automatiques devant vous</h3>
            <p class="sub" style="margin:0 0 10px">Le robot envoie cinq candidatures, puis s'arrête. Comparez-les ensuite aux
              accusés de réception reçus par e-mail.</p>
            <div class="row">
              <button class="btn primary" :disabled="robotBusy || !!camp.data.alerte"
                      @click="startRobot('cinq')">Lancer les envois devant moi</button>
              <button v-if="camp.data.passage.cinq && camp.data.passage.cinq.envoyees" class="btn" :disabled="camp.busy || robotBusy"
                      @click="validerCinq">Les accusés correspondent : valider</button>
            </div>
            <div v-if="camp.data.passage.cinq" class="alert info" style="margin-top:12px">
              {{ camp.data.passage.cinq.envoyees }} envoi(s) confirmé(s) le {{ fmtDate(camp.data.passage.cinq.le) }}.
              Comparez avec vos accusés de réception avant de valider.</div>
            <div v-if="camp.cinqError" class="alert error" style="margin-top:12px" role="alert">{{ camp.cinqError }}</div>
          </div>
        </div>

        <!-- Robot : journal et captures -->
        <div v-if="robot.data && robot.data.id" class="card">
          <div class="offer-head"><h2 style="margin:0">Robot</h2>
            <span class="meta">{{ modesRobot[robot.data.mode] || '' }} · {{ fmtDateHeure(robot.data.debut) }}</span></div>
          <div v-if="robot.data.statut && !['en_cours', 'en_pause'].includes(robot.data.statut)"
               :class="['alert', robot.data.statut === 'termine' ? 'info' : 'warn']" style="margin-top:12px">{{ robot.data.resume }}</div>
          <p v-if="robot.data.actif && robot.data.fenetre_ouverte" class="sub" style="margin:10px 0 0">
            Travail enregistré. La fenêtre du robot se ferme toute seule {{ ['essai', 'calibrage'].includes(robot.data.mode)
              ? '10 min' : '1 min' }} après la fin ; fermez-la avant pour relancer tout de suite.</p>
          <h3 style="margin-top:16px">Journal</h3>
          <pre class="journal">{{ robot.data.journal.join('\n') || 'Aucune ligne pour l’instant.' }}</pre>
          <template v-if="robot.data.captures.length">
            <h3 style="margin-top:18px">Captures ({{ robot.data.captures.length }})</h3>
            <div class="captures">
              <a v-for="c in robot.data.captures" :key="c.nom" class="capture" :href="c.url" target="_blank" rel="noopener noreferrer">
                <img :src="c.url" :alt="c.legende" loading="lazy">{{ c.legende }}</a>
            </div>
          </template>
        </div>

        <!-- Message -->
        <div class="card">
          <h2>Message</h2>
          <p class="sub" style="margin:0 0 12px">Modèle : <code>{{ camp.data.message.chemin_a }}</code> (un seul champ :
            <code>{entreprise}</code>). Version B facultative : <code>{{ camp.data.message.chemin_b }}</code>
            ({{ camp.data.message.version_b ? 'présente : A et B en alternance' : 'absente' }}).</p>
          <div v-for="p in camp.data.message.problemes" :key="p" class="alert error" style="margin-bottom:12px" role="alert">{{ p }}</div>
          <div class="form-row two">
            <div><label for="camp-exemple">Entreprise exemple</label>
              <input id="camp-exemple" type="text" v-model="camp.exemple" @input="rafraichirApercu"></div>
          </div>
          <div v-for="(m, v) in (camp.apercu || camp.data.message).versions" :key="v" style="margin-top:14px">
            <div class="sub">Version {{ v }} · nom utilisé : « {{ m.nom }} » · {{ m.longueur }} / 1500 caractères<template
              v-if="m.retires.length"> · retirés : {{ m.retires.join(' ') }}</template></div>
            <div v-for="p in m.problemes" :key="p" class="alert error" style="margin-top:8px">{{ p }}</div>
            <pre class="letter message">{{ m.texte }}</pre>
          </div>
          <template v-if="camp.data.versions.length">
            <h3 style="margin-top:18px">Envois et réponses par version</h3>
            <table class="compact">
              <thead><tr><th>Version</th><th>Envoyées</th><th>Réponses</th><th>Positives</th><th>Refus</th><th>Autres</th></tr></thead>
              <tbody><tr v-for="s in camp.data.versions" :key="s.version">
                <td data-label="Version">{{ s.version }}</td><td data-label="Envoyées">{{ s.envoyees }}</td>
                <td data-label="Réponses">{{ s.reponses }}</td><td data-label="Positives">{{ s.positive }}</td>
                <td data-label="Refus">{{ s.refus }}</td><td data-label="Autres">{{ s.autre }}</td></tr></tbody>
            </table>
          </template>
        </div>

        <!-- Réglages -->
        <form class="card" novalidate @submit.prevent="saveCampagneReglages" @input="camp.formTouched = true"
              @change="camp.formTouched = true">
          <h2>Réglages</h2>
          <div class="grid-2">
            <div><label for="c-cv">CV à joindre <span class="hint">nom du document sur La Bonne Boîte</span></label>
              <input id="c-cv" type="text" v-model="camp.form.nom_cv" placeholder="Nom exact du CV dans « Vos documents »">

<!-- Vue 3.4.38 servi en local (identique au paquet npm vue@3.4.38) : aucune ressource externe. -->
<script src="/frontend/vendor/vue-3.4.38.global.prod.js"></script>
<script>
(function () {
  if (!window.Vue) return; // le message de secours reste affiché
  const { createApp, reactive, ref, computed, onMounted } = Vue;

  const VIEWS = [
    { id: 'candidature', label: 'Nouvelle candidature' },
    { id: 'offres', label: 'Offres' },
    { id: 'campagne', label: 'Campagne' },
    { id: 'suivi', label: 'Suivi' },
    { id: 'parametres', label: 'Paramètres' },
  ];

  async function api(path, options = {}) {
    let res;
    try {
      res = await fetch(path, { headers: { 'Content-Type': 'application/json' }, ...options });
    } catch (e) {
      throw new Error("Serveur injoignable : vérifiez que l'application est lancée.");
    }
    let data = null;
    try { data = await res.json(); } catch (e) { /* réponse sans corps JSON */ }
    if (!res.ok) {
      const detail = data && typeof data.detail === 'string' ? data.detail : null;
      if (res.status === 429) throw new Error(detail || 'Quota du modèle de langage atteint : réessayez plus tard.');
      throw new Error(detail || `Erreur ${res.status} : réessayez dans un instant.`);
    }
    return data;
  }

  createApp({
    template: '#tpl',
    setup() {
      const view = ref('candidature');
      const defaults = reactive({ titres: [], mots_exclus: [] });
      const statuses = ref([]);
      const prep = reactive({ text: '', url: '', source: null, externalId: null, label: '', loading: false, error: '',
                              result: null, applied: null, marking: false, markError: '', copied: false, copyError: '',
                              preparedText: '', regenerating: false, regenError: '' });
      const offers = reactive({ keyword: '', city: '', contract: '', hide: true, loading: false, error: '',
                                items: [], hidden: 0, searched: false });
      const track = reactive({ loading: false, error: '', items: [], saving: {}, rowError: {} });
      const settings = reactive({ loading: false, error: '', data: null, acces: null, accesLoading: false });
      const camp = reactive({ loading: false, error: '', data: null, busy: false, acces: null, accesLoading: false,
                              verif: null, verifLoading: false, invLoading: false, invError: '', recherche: '', choix: [],
                              choixSiret: '', manuel: { siret: '', entreprise: '', rome: 'M1811', departement: '' }, manuelError: '',
                              regle: { bouton: '', url_motif: '', texte: '' }, regleTouched: false, regleError: '',
                              cinqError: '', form: {}, nombre: '', nombreTouche: false, formTouched: false, saving: false,
                              saved: false,
                              reglagesError: '', exemple: 'UBER EATS FRANCE SAS', apercu: null, rowSaving: {}, rowError: {},
                              hist: { statut: 'tous', phase: '', reponse: '', recherche: '', data: null, loading: false, error: '' } });
      const robot = reactive({ data: null, error: '', starting: false, stopping: false, busy: false });
      let robotTimer = null, robotSig = '', invTimer = null;
      const robotBusy = computed(() => robot.starting || !!(robot.data && robot.data.actif));
      const etapesPassage = ["API et plan", 'Essai sans envoi', 'Calibrage', 'Cinq envois devant vous', 'Campagne'];
      const modesRobot = { essai: 'Essai', calibrage: 'Calibrage', cinq: 'Cinq envois', campagne: 'Campagne' };
      const tousMetiers = computed(() => camp.data ? ['A', 'B'].flatMap(p => camp.data.metiers[p].flatMap(g => g.metiers)) : []);
      const statutsHistorique = computed(() => camp.data ? Object.fromEntries(Object.entries(camp.data.statuts)
        .filter(([s]) => s !== 'a_faire')) : {});
      const nombreValide = computed(() => Number.isInteger(camp.nombre) && camp.nombre >= 1
        && camp.nombre <= (camp.data ? camp.data.objectif_max : 1000));
      const inventaireEnCours = computed(() => !!camp.data && camp.data.plan.inventaire.etat === 'en_cours');
      const inventaireTexte = computed(() => {
        const inv = camp.data ? camp.data.plan.inventaire : null;
        if (!inv || inv.etat === 'jamais') return 'pas encore lancé.';
        const nb = (n) => Number(n || 0).toLocaleString('fr-FR');
        const faites = inv.faites || 0, total = faites + (inv.restantes || 0);
        const ajoutees = inv.ajoutees != null ? `, ${nb(inv.ajoutees)} entreprise(s) ajoutée(s)` : '';
        if (inv.etat === 'en_cours') return `en cours : ${inv.zone || 'Île-de-France'} (${nb(faites)} recherche(s) sur `
          + `${nb(total)} terminée(s)${ajoutees})…`;
        if (inv.etat === 'erreur') return 'interrompu (voir le message en haut de l\'écran).';
        const reste = inv.restantes ? ` ${nb(inv.restantes)} recherche(s) à faire (nouvelles villes ou phase B) : `
          + '« Lancer l\'inventaire » les fait.' : ' À jour : « Nouvel inventaire » refait toutes les recherches.';
        return `terminé le ${fmtDateHeure(inv.fin)} (Île-de-France, puis les villes de chaque département ; ${nb(faites)} `
          + `recherche(s)${ajoutees}).${reste}`;
      });
      const inventaireAJour = computed(() => !!camp.data && camp.data.plan.inventaire.etat === 'termine'
        && !camp.data.plan.inventaire.restantes);
      const etatCampagne = computed(() => {
        const r = robot.data, d = camp.data;
        if (r && r.actif) {
          if (r.attente === 'connexion') return { libelle: 'Attente de connexion', classe: 'attente' };
          if (r.attente === 'reconnexion') return { libelle: 'Attente de reconnexion', classe: 'pause' };
          if (r.attente === 'clic') return { libelle: 'Attente de votre clic', classe: 'attente' };
          if (r.statut === 'en_pause') return { libelle: 'En pause', classe: 'pause' };
          if (r.pause_demandee) return { libelle: 'Pause demandée…', classe: 'pause' };
          if (r.statut === 'en_cours') return { libelle: (modesRobot[r.mode] || 'Robot') + ' en cours', classe: 'ok' };
          return { libelle: 'Fenêtre ouverte', classe: '' };
        }
        if (d && d.alerte) return { libelle: 'Arrêtée sur alerte', classe: 'alerte' };
        if (r && r.statut === 'arrete') return { libelle: 'Arrêtée', classe: 'pause' };
        if (r && r.statut === 'erreur') return { libelle: 'Arrêtée sur erreur', classe: 'alerte' };
        return { libelle: d && d.etape < 5 ? 'Premier passage' : 'Prête', classe: '' };
      });

      const fmtDate = (v) => {
        if (!v) return '';
        const d = new Date(v);
        return isNaN(d) ? '' : d.toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
      };
      const fmtDateHeure = (v) => {
        if (!v) return '';
        const d = new Date(v);
        return isNaN(d) ? '' : d.toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });
      };
      const contractLabel = (c) => ({ these_cifre: 'Thèse CIFRE', inconnu: '' }[c] ?? c ?? '');
      const key = (a) => a.source + '/' + a.external_id;
      const viaLabel = (p) => {
        const via = p.via.toLowerCase() !== p.mot_cle.toLowerCase() ? 'via ' + p.via : '';
        return [via, p.notion ? 'notion du Master' : ''].filter(Boolean).join(' · ');
      };

      function resetPrep() {
        Object.assign(prep, { text: '', url: '', source: null, externalId: null, label: '', error: '', result: null,
                              applied: null, markError: '', copied: false, copyError: '', preparedText: '', regenError: '' });
      }

      async function prepare() {
        prep.error = ''; prep.applied = null; prep.markError = ''; prep.copied = false; prep.copyError = ''; prep.regenError = '';
        if (!prep.text.trim()) { prep.error = "Collez le texte de l'offre avant de préparer la candidature."; return; }
        prep.loading = true; prep.result = null;
        try {
          prep.result = await api('/api/prepare', { method: 'POST', body: JSON.stringify({
            offer_text: prep.text, url: prep.url || null, source: prep.source, external_id: prep.externalId }) });
          prep.preparedText = prep.text; // la régénération porte sur l'offre préparée, même si le texte est modifié ensuite
        } catch (e) { prep.error = e.message; } finally { prep.loading = false; }
      }

      async function regenerateLetter() {
        prep.regenerating = true; prep.regenError = ''; prep.copied = false; prep.copyError = '';
        try {
          const data = await api('/api/prepare/lettre', { method: 'POST', body: JSON.stringify({ offer_text: prep.preparedText }) });
          prep.result.lettre = data.lettre; prep.result.lettre_erreur = null;
        } catch (e) { prep.regenError = 'Nouvelle lettre non générée : ' + e.message; } finally { prep.regenerating = false; }
      }

      async function markApplied() {
        const o = prep.result.offre;
        prep.marking = true; prep.markError = '';
        try {
          const data = await api(`/api/applications/${encodeURIComponent(o.source)}/${encodeURIComponent(o.external_id)}/postule`,
                                 { method: 'POST' });
          prep.applied = data.item; prep.result.statut = data.item.statut;
        } catch (e) { prep.markError = e.message; } finally { prep.marking = false; }
      }

      async function copyLetter() {
        prep.copyError = '';
        try {
          await navigator.clipboard.writeText(prep.result.lettre.texte);
          prep.copied = true;
          setTimeout(() => { prep.copied = false; }, 2500);
        } catch (e) { prep.copyError = 'Copie impossible : sélectionnez le texte de la lettre et copiez-le manuellement.'; }
      }

      function prepareFromOffer(o) {
        resetPrep();
        const head = [o.title, o.company && 'Entreprise : ' + o.company, o.location && 'Lieu : ' + o.location,
                      o.contract_type && 'Contrat : ' + o.contract_type].filter(Boolean);
        prep.text = head.join('\n') + '\n\n' + (o.description || '');
        prep.url = o.url || ''; prep.source = o.source; prep.externalId = o.external_id;
        prep.label = [o.title, o.company].filter(Boolean).join(' — ');
        location.hash = '#/candidature';
      }

      async function search() {
        offers.loading = true; offers.error = '';
        const params = new URLSearchParams({ keyword: offers.keyword, ville: offers.city, contrat: offers.contract,
                                             masquer: offers.hide ? 'true' : 'false', limit: '30' });
        try {
          const data = await api('/api/jobs/search?' + params.toString());
          offers.items = data.offres; offers.hidden = data.masquees; offers.searched = true;
        } catch (e) { offers.error = e.message; offers.items = []; } finally { offers.loading = false; }
      }

      async function loadTracking() {
        track.loading = true; track.error = '';
        try {
          const [items, st] = await Promise.all([api('/api/applications'), statuses.value.length ? null : api('/api/statuses')]);
          track.items = items;
          if (st) statuses.value = st;
        } catch (e) { track.error = e.message; } finally { track.loading = false; }
      }

      async function changeStatus(a, status) {
        const k = key(a);
        track.saving[k] = true; track.rowError[k] = '';
        try {
          const data = await api(`/api/applications/${encodeURIComponent(a.source)}/${encodeURIComponent(a.external_id)}`,
                                 { method: 'PATCH', body: JSON.stringify({ status }) });
          Object.assign(a, data.item);
        } catch (e) { track.rowError[k] = e.message; } finally { track.saving[k] = false; }
      }

      async function loadSettings() {
        settings.loading = true; settings.error = ''; settings.acces = null;
        try {
          settings.data = await api('/api/status');
        } catch (e) { settings.error = e.message; } finally { settings.loading = false; }
      }

      async function checkAccess() {
        settings.accesLoading = true; settings.acces = null;
        try { settings.acces = await api('/api/campagne/acces'); }
        catch (e) { settings.acces = { ok: false, detail: e.message }; } finally { settings.accesLoading = false; }
      }

      // Campagne : état relu toutes les 1,5 s tant que le robot tourne (2 s pendant l'inventaire).
      const signature = (r) => JSON.stringify(r ? [r.id, r.statut, r.compteurs, r.actif, r.attente] : null);

      function setRobot(data) {
        robot.data = data; robotSig = signature(data);
        clearTimeout(robotTimer); robotTimer = null;
        if (view.value === 'campagne' && data && data.actif) robotTimer = setTimeout(pollRobot, 1500);
      }

      async function pollRobot() {
        let data;
        try { data = await api('/api/campagne/robot'); robot.error = ''; }
        catch (e) { robot.error = e.message; setRobot(robot.data); return; }
        const changed = signature(data) !== robotSig;
        setRobot(data);
        if (changed) await refreshCampagne();
      }

      function setCampagne(data) {
        camp.data = data;
        if (!camp.formTouched) Object.assign(camp.form, { nom_cv: data.reglages.nom_cv, phase_a: data.reglages.phase_a,
                                                           phase_b: data.reglages.phase_b });
        if (!camp.nombreTouche) camp.nombre = data.reglages.objectif;
        if (data.passage.regle && !camp.regleTouched) Object.assign(camp.regle, data.passage.regle);
        setRobot(data.robot);
        clearTimeout(invTimer); invTimer = null;
        if (view.value === 'campagne' && data.plan.inventaire.etat === 'en_cours') invTimer = setTimeout(refreshCampagne, 2000);
      }

      async function refreshCampagne() {
        try { setCampagne(await api('/api/campagne')); camp.error = ''; } catch (e) { camp.error = e.message; }
        if (camp.data && (camp.data.etape === 2 || camp.data.etape === 3)) await chercherEntreprises();
        await loadHistorique(camp.hist.data ? camp.hist.data.page : 1);
      }

      async function loadCampagne() {
        camp.loading = true; camp.error = ''; camp.formTouched = false; camp.regleTouched = false;
        try { setCampagne(await api('/api/campagne')); } catch (e) { camp.error = e.message; } finally { camp.loading = false; }
        if (camp.data) {
          // Accès à l'API vérifié à l'ouverture de l'écran (jeton seulement, aucune recherche).
          await Promise.all([loadHistorique(1), chercherEntreprises(), camp.acces ? null : checkAccesCampagne()]);
          if (!camp.choixSiret && camp.data.passage.essai) camp.choixSiret = camp.data.passage.essai.siret;
        }
      }

      async function checkAccesCampagne() {
        camp.accesLoading = true; camp.acces = null;
        try { camp.acces = await api('/api/campagne/acces'); }
        catch (e) { camp.acces = { ok: false, detail: e.message }; } finally { camp.accesLoading = false; }
      }

      async function verifierMetiers() {
        camp.verifLoading = true; camp.error = '';
        try { camp.verif = await api('/api/campagne/metiers/verifier', { method: 'POST' }); }
        catch (e) { camp.error = e.message; } finally { camp.verifLoading = false; }
      }

      async function validerMetiers() {
        camp.busy = true;
        try { await api('/api/campagne/metiers/valider', { method: 'POST' }); await refreshCampagne(); }
        catch (e) { camp.error = e.message; } finally { camp.busy = false; }
      }

      async function lancerInventaire(nouveau = false) {
        camp.invLoading = true; camp.invError = '';
        try {
          await api('/api/campagne/inventaire', { method: 'POST', body: JSON.stringify({ nouveau }) });
          await refreshCampagne();
        } catch (e) { camp.invError = e.message; } finally { camp.invLoading = false; }
      }
      function nouvelInventaire() {
        const n = camp.data.plan.inventaire.faites || 0, minutes = Math.max(1, Math.round(n * 0.55 / 60));
        if (confirm(`Refaire toutes les recherches (${n.toLocaleString('fr-FR')}, environ ${minutes} min) ? Les entreprises déjà en base `
          + 'ne sont jamais reprises : seules les nouvelles sont ajoutées.')) lancerInventaire(true);
      }

      let choixTimer = null;
      async function chercherEntreprises() {
        clearTimeout(choixTimer);
        return new Promise((resolve) => {
          choixTimer = setTimeout(async () => {
            try {
              const r = await api('/api/campagne/entreprises?limite=12&recherche=' + encodeURIComponent(camp.recherche));
              camp.choix = r.items;
            } catch (e) { camp.error = e.message; }
            resolve();
          }, 250);
        });
      }

      async function ajouterManuelle() {
        camp.busy = true; camp.manuelError = '';
        try {
          const e = await api('/api/campagne/entreprises', { method: 'POST', body: JSON.stringify(camp.manuel) });
          camp.recherche = e.siret; await chercherEntreprises(); camp.choixSiret = e.siret;
          Object.assign(camp.manuel, { siret: '', entreprise: '', departement: '' });
        } catch (e) { camp.manuelError = e.message; } finally { camp.busy = false; }
      }

      async function startRobot(mode, siret, nombre) {
        robot.starting = true; robot.error = '';
        try {
          setRobot(await api('/api/campagne/robot', { method: 'POST',
            body: JSON.stringify({ mode, siret: siret || null, nombre: nombre === undefined ? null : nombre }) }));
          camp.nombreTouche = false;
          await refreshCampagne();
        } catch (e) { robot.error = e.message; } finally { robot.starting = false; }
      }

      async function pauseRobot(active) {
        robot.busy = true; robot.error = '';
        try { setRobot(await api('/api/campagne/robot/' + (active ? 'pause' : 'reprendre'), { method: 'POST' })); }
        catch (e) { robot.error = e.message; } finally { robot.busy = false; }
      }

      async function passerCalibrage() {
        robot.busy = true; robot.error = '';
        try { setRobot(await api('/api/campagne/robot/passer', { method: 'POST' })); }
        catch (e) { robot.error = e.message; } finally { robot.busy = false; }
      }

      async function stopRobot() {
        robot.stopping = true; robot.error = '';
        try { setRobot(await api('/api/campagne/robot/arret', { method: 'POST' })); }
        catch (e) { robot.error = e.message; } finally { robot.stopping = false; }
      }

      async function validerRegle() {
        camp.busy = true; camp.regleError = '';
        try {
          await api('/api/campagne/regle/valider', { method: 'POST', body: JSON.stringify({ bouton: camp.regle.bouton,
            url_motif: camp.regle.url_motif, texte: camp.regle.texte }) });
          camp.regleTouched = false; await refreshCampagne();
        } catch (e) { camp.regleError = e.message; } finally { camp.busy = false; }
      }

      async function validerCinq() {
        camp.busy = true; camp.cinqError = '';
        try { await api('/api/campagne/cinq/valider', { method: 'POST' }); await refreshCampagne(); }
        catch (e) { camp.cinqError = e.message; } finally { camp.busy = false; }
      }

      async function saveCampagneReglages() {
        camp.saving = true; camp.saved = false; camp.reglagesError = '';
        try {
          await api('/api/campagne/reglages', { method: 'PUT', body: JSON.stringify(camp.form) });
          camp.formTouched = false; camp.saved = true; await refreshCampagne();
        } catch (e) { camp.reglagesError = e.message; } finally { camp.saving = false; }
      }

      let apercuTimer = null;
      function rafraichirApercu() {
        clearTimeout(apercuTimer);
        apercuTimer = setTimeout(async () => {
          try { camp.apercu = await api('/api/campagne/apercu?entreprise=' + encodeURIComponent(camp.exemple)); }
          catch (e) { camp.error = e.message; }
        }, 250);
      }

      const filtresHistorique = () => new URLSearchParams({ statut: camp.hist.statut, phase: camp.hist.phase,
                                                             reponse: camp.hist.reponse, recherche: camp.hist.recherche });
      const exportUrl = computed(() => '/api/campagne/export.csv?' + filtresHistorique().toString());

      async function loadHistorique(page) {
        camp.hist.loading = true; camp.hist.error = '';
        try {
          const params = filtresHistorique(); params.set('page', page || 1);
          camp.hist.data = await api('/api/campagne/historique?' + params.toString());
        } catch (e) { camp.hist.error = e.message; } finally { camp.hist.loading = false; }
      }

      let histTimer = null;
      function chercherHistorique() { clearTimeout(histTimer); histTimer = setTimeout(() => loadHistorique(1), 300); }

      async function setReponse(h, valeur) {
        camp.rowSaving[h.siret] = true; camp.rowError[h.siret] = '';
        try {
          const item = await api(`/api/campagne/${encodeURIComponent(h.siret)}/reponse`, { method: 'POST',
            body: JSON.stringify({ reponse: valeur || null }) });
          Object.assign(h, item);
          camp.data.versions = (await api('/api/campagne')).versions;
        } catch (e) { camp.rowError[h.siret] = e.message; } finally { camp.rowSaving[h.siret] = false; }
      }

      async function aLaMain(h) {
        camp.rowSaving[h.siret] = true; camp.rowError[h.siret] = '';
        try {
          Object.assign(h, await api(`/api/campagne/${encodeURIComponent(h.siret)}/main`, { method: 'POST' }));
          await refreshCampagne();
        } catch (e) { camp.rowError[h.siret] = e.message; } finally { camp.rowSaving[h.siret] = false; }
      }

      async function resoudre(h, statut) {
        camp.rowSaving[h.siret] = true; camp.rowError[h.siret] = '';
        try {
          Object.assign(h, await api(`/api/campagne/${encodeURIComponent(h.siret)}/statut`, { method: 'POST',
            body: JSON.stringify({ statut }) }));
          await refreshCampagne();
        } catch (e) { camp.rowError[h.siret] = e.message; } finally { camp.rowSaving[h.siret] = false; }
      }

      function route() {
        const id = (location.hash || '').replace('#/', '');
        view.value = VIEWS.some(v => v.id === id) ? id : 'candidature';
        clearTimeout(robotTimer); robotTimer = null; clearTimeout(invTimer); invTimer = null;
        if (view.value === 'campagne') loadCampagne();
        if (view.value === 'suivi') loadTracking();
        if (view.value === 'parametres') loadSettings();
        window.scrollTo(0, 0);
      }

      onMounted(async () => {
        window.addEventListener('hashchange', route);
        route();
        try {
          Object.assign(defaults, await api('/api/search/defaults'));
          if (!offers.keyword) offers.keyword = defaults.titres[0] || '';
        } catch (e) { offers.error = e.message; }
      });

      return { views: VIEWS, view, defaults, statuses, prep, offers, track, settings, camp, robot, robotBusy, etapesPassage,
               modesRobot, tousMetiers, statutsHistorique, nombreValide, inventaireEnCours, inventaireTexte, inventaireAJour,
               nouvelInventaire, etatCampagne, exportUrl,
               fmtDate, fmtDateHeure, contractLabel, key, viaLabel, resetPrep, prepare, regenerateLetter, markApplied,
               copyLetter, prepareFromOffer, search, changeStatus, checkAccess, checkAccesCampagne, verifierMetiers,
               validerMetiers, lancerInventaire, chercherEntreprises, ajouterManuelle, startRobot, pauseRobot,
               passerCalibrage, stopRobot, validerRegle, validerCinq, saveCampagneReglages, rafraichirApercu,
               loadHistorique, chercherHistorique, setReponse, resoudre, aLaMain };
    },
  }).mount('#app');
})();
</script>
</body>
</html>
